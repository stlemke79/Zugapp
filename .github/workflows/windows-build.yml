name: Windows-Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Bauen (win-x64, ohne .NET-Installation lauffähig)
        run: dotnet publish src/Diktat/Diktat.csproj -c Release -r win-x64 --self-contained -o publish

      - name: Programm als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Diktat-win-x64
          path: publish/
          retention-days: 30
